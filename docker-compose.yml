# Keep container logs from filling the disk: at most 5 × 20 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopsmart_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER:-shopuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
      POSTGRES_DB: ${DB_NAME:-shopsmart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shopuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopsmart_redis
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: shopsmart_app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-shopuser}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
      DB_NAME: ${DB_NAME:-shopsmart}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env - see .env.example}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopsmart.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Synthetic shoppers + simulated warehouse (see traffic-generator/ and src/jobs/warehouse.js)
      SYNTHETIC_BOT_PASSWORD: ${SYNTHETIC_BOT_PASSWORD:-}
      SIMULATE_WAREHOUSE: "true"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build: ./frontend
    container_name: shopsmart_frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    container_name: shopsmart_nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
      - frontend
    networks:
      default:
        # Inside Docker the site's own name points straight at nginx, so the
        # traffic generator connects on the internal port 8443 with a valid
        # certificate (see nginx.conf). Outside Docker nothing changes.
        aliases:
          - shopsmart-aisre.duckdns.org

  traffic-generator:
    build: ./traffic-generator
    container_name: shopsmart_traffic_bot
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Internal-only port: lets each synthetic shopper keep its own IP address
      TARGET_URL: https://shopsmart-aisre.duckdns.org:8443
      SYNTHETIC_BOT_PASSWORD: ${SYNTHETIC_BOT_PASSWORD:-}
      # Average visits per day; the hour-by-hour curve is in bot.js
      DAILY_VISITS: ${DAILY_VISITS:-8000}
    volumes:
      # Customer accounts the bots signed up, kept across restarts
      - bot_data:/data
    depends_on:
      - nginx

  patient-metrics-agent:
    build: ./patient-metrics-agent
    container_name: shopsmart_metrics_agent
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - metrics_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN}
      AGENT_DRY_RUN: "true"
      REMEDIATION_TARGET: shopsmart_app
    ports:
      - "8080:8080"
    

volumes:
  postgres_data:
  bot_data:
  metrics_data: