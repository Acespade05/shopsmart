services:
  postgres:
    image: postgres:15-alpine
    container_name: shopsmart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shopuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
      POSTGRES_DB: ${DB_NAME:-shopsmart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shopuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopsmart_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: shopsmart_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-shopuser}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
      DB_NAME: ${DB_NAME:-shopsmart}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build: ./frontend
    container_name: shopsmart_frontend
    restart: unless-stopped
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    container_name: shopsmart_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - frontend

traffic-generator:
    build: ./traffic-generator
    container_name: shopsmart_traffic_bot
    restart: unless-stopped
    environment:
      TARGET_URL: https://shopsmart-aisre.duckdns.org
    depends_on:
      - nginx

volumes:
  postgres_data: