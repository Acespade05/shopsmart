version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopsmart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shopuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
      POSTGRES_DB: ${DB_NAME:-shopsmart}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shopuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopsmart_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: shopsmart_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-shopuser}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
      DB_NAME: ${DB_NAME:-shopsmart}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  # NOTE: nginx (reverse proxy + rate limiting + log source) and the metrics
  # service (psutil collector for the Doctor VM) are added in Week 5, per the
  # ShopSmart build order. Left out here so the Week 1 slice stays minimal
  # and fast to iterate on.

volumes:
  postgres_data:
