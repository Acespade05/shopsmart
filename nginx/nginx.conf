worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Who the client is. Public traffic (ports 80/443) is always the real TCP
    # peer; any X-Forwarded-For it sends is ignored, so it can't be spoofed.
    # Port 8443 is NOT published outside Docker: only the traffic generator
    # reaches it, and there each synthetic shopper's own IP is taken from
    # X-Forwarded-For, so logs, rate limits and sessions see distinct visitors.
    map $http_x_forwarded_for $xff_or_peer {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }
    map $server_port $client_ip {
        8443    $xff_or_peer;
        default $remote_addr;
    }

    # Dynamic edge block list. The AI-SRE agent rewrites blockmap.conf (one
    # "<ip> 1;" line per blocked client) and reloads nginx when it decides to
    # block a source — a flood, brute-force or scanner it detected. Keyed on
    # $client_ip, so it catches BOTH real external attackers (port 443) and
    # internally generated red-team traffic (port 8443 with X-Forwarded-For).
    # The file must exist (empty = nothing blocked); the agent clears it on start.
    map $client_ip $ip_blocked {
        default 0;
        include /etc/nginx/blockmap.conf;
    }

    # Same fields as before plus upstream time (urt) — how long the app itself took.
    log_format main '$client_ip - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log;

    limit_req_zone $client_ip zone=api_limit:10m rate=20r/s;
    # Sign-in attempts: 10 per minute per IP (stops password guessing)
    limit_req_zone $client_ip zone=login_limit:10m rate=10r/m;

    # Docker's internal DNS. Looking the app/frontend containers up at request
    # time (instead of once at startup) means that when `docker compose up --build`
    # recreates a container with a new internal IP, nginx follows it instead of
    # returning 502 until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirect all plain HTTP to HTTPS
    server {
        listen 80;
        server_name shopsmart-aisre.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen 8443 ssl; # internal only (traffic generator), see map above
        server_name shopsmart-aisre.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/shopsmart-aisre.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shopsmart-aisre.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Blocked clients are refused at the edge before any upstream work. The
        # AI-SRE agent populates the block list after detecting an attack source.
        if ($ip_blocked) { return 403; }

        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            limit_req_status 429;
            set $backend_upstream http://app:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            set $backend_upstream http://app:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            set $backend_upstream http://app:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
        }
    }
}