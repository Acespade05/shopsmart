worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # Sign-in attempts: 10 per minute per IP (stops password guessing)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    # Docker's internal DNS. Looking the app/frontend containers up at request
    # time (instead of once at startup) means that when `docker compose up --build`
    # recreates a container with a new internal IP, nginx follows it instead of
    # returning 502 until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirect all plain HTTP to HTTPS
    server {
        listen 80;
        server_name shopsmart-aisre.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name shopsmart-aisre.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/shopsmart-aisre.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shopsmart-aisre.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            limit_req_status 429;
            set $backend_upstream http://app:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            set $backend_upstream http://app:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            set $backend_upstream http://app:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}